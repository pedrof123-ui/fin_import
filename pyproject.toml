[project]
name = "fin-import2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.4",
    "edgartools",
    "fastapi>=0.135.3",
    "anthropic>=0.50.0",
    "openai>=1.0.0",
    "openai-agents>=0.8.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.0",
    "uvicorn[standard]>=0.40.0",
    "yfinance>=0.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.13.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "joblib>=1.5.3",
    "xlrd>=2.0.2",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "ib-insync>=0.9.86",
    "nest-asyncio>=1.6.0",
    "ib-async>=2.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=7.1.0",
    "nbconvert>=7.17.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests that hit SEC EDGAR (slow, requires network)",
]
